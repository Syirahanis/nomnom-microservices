spring.application.name=nomnom-restaurant-service

# Port map agreed by team (from order-service application.properties):
# customer-service=8080, order-service=8081, restaurant-catalog-service=8082, delivery-service=8083
server.port=8081

spring.datasource.url=jdbc:h2:mem:nomnom_restaurant
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=restaurant-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.nomnom.restaurantservice.event.OrderPlacedEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.nomnom.restaurantservice.event
