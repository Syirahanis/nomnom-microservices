spring.application.name=nomnom-order-service

# Order Service runs on its own port. Agreed port map for the team:
# customer-service=8080, order-service=8082, restaurant-catalog-service=8082, delivery-service=8083
server.port=8082

spring.datasource.url=jdbc:h2:mem:nomnom_order
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Kafka broker
spring.kafka.bootstrap-servers=localhost:9092

# Kafka producer (publishes order.placed)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka consumer group (order-service consumes order.confirmed and order.delivered;
# each event type gets its own typed listener container factory - see KafkaConsumerConfig)
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest

# Customer Service base URL - used for the synchronous REST lookup that validates
# a customerCode exists before an order can be placed
customer-service.base-url=http://localhost:8080
