spring.application.name=nomnom-delivery-service

# Delivery Service runs on its own port. Agreed port map for the team:
# customer-service=8080, order-service=8082, restaurant-catalog-service=8081, delivery-service=8083
server.port=8083

spring.datasource.url=jdbc:h2:mem:nomnom_delivery
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka broker
spring.kafka.bootstrap-servers=localhost:9092

# Kafka producer (publishes delivery.assigned and order.delivered)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka consumer group (delivery-service consumes order.confirmed;
# each event type gets its own typed listener container factory - see KafkaConsumerConfig)
spring.kafka.consumer.group-id=delivery-service
spring.kafka.consumer.auto-offset-reset=earliest
