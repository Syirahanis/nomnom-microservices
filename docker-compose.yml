services:

  # Kafka broker
  kafka:
    image: apache/kafka:latest
    container_name: nomnom-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Customer Service - port 8080
  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: nomnom-customer-service
    ports:
      - "8080:8080"
    environment:
      # Point Kafka at the broker container instead of localhost
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Restaurant Service - port 8081
  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: nomnom-restaurant-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Order Service - port 8082
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: nomnom-order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CUSTOMER_SERVICE_BASE_URL: http://customer-service:8080
    depends_on:
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_started

  # Delivery Service - port 8083
  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    container_name: nomnom-delivery-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Frontend - static htmlcssjs serv by nginx on port 5500
  frontend:
    build:
      context: ./nomnom-frontend
      dockerfile: Dockerfile
    container_name: nomnom-frontend
    ports:
      - "5500:80"
    depends_on:
      - customer-service
      - restaurant-service
      - order-service
      - delivery-service
